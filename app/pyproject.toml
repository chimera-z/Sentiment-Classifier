[project]
name = "imdb-sentiment-api"
version = "0.1.0"
description = "API de clasificación de sentimiento para reseñas de películas de IMDb"
authors = [
    { name = "AS" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
